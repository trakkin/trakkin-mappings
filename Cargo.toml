[workspace]
members = [
  "crates/trakkin-mappings-cli",
  "crates/trakkin-mappings-compiler",
  "crates/trakkin-mappings-corpus",
  "crates/trakkin-mappings-language",
  "crates/trakkin-mappings-ingestion",
]
resolver = "3"

[workspace.package]
authors = ["Elias Benbourenane"]
edition = "2024"
homepage = "https://trakkin.dev"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/trakkin/trakkin-mappings"
rust-version = "1.97.1"
version = "0.0.0"

[workspace.dependencies]
anyhow = "1.0.104"
antlr-rust-codegen = "=0.29.0"
antlr-rust-runtime = "=0.29.0"
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "std",
] }
flate2 = "1.1.10"
httpdate = "1.0.3"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "json",
  "query",
  "rustls",
] }
fs2 = "0.4.3"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
trakkin-mappings-corpus = { path = "crates/trakkin-mappings-corpus" }
trakkin-mappings-compiler = { path = "crates/trakkin-mappings-compiler" }
trakkin-mappings-language = { path = "crates/trakkin-mappings-language" }
trakkin-mappings-ingestion = { path = "crates/trakkin-mappings-ingestion" }
zstd = "0.13.3"
